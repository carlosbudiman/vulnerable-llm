version: '3.8'

services:
  caddy:
    image: caddy:2-alpine
    container_name: vulnerable-llm-caddy
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - app

  app:
    build: .
    container_name: vulnerable-llm
    ports:
      - "5001:5000"  # Expose 5001 directly (5000 is taken by macOS ControlCenter)
    env_file:
      - ".env"
    environment:
      - GEMINI_API_KEY=${GEMINI_API_KEY}
      - HOST=0.0.0.0
      - PORT=5000
      - FLASK_ENV=production
      - REQUEST_TIMEOUT=60
      - MAX_RETRIES=3
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5000/api/levels"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

volumes:
  caddy_data:
  caddy_config:
